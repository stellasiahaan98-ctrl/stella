name: flutter_application_1
description: "Praktikum PAM W6S2S3 - Navigation and Page Detail (Sayur Mayur)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_screenutil: ^5.9.3
  font_awesome_flutter: ^11.0.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Taruh gambar sayur di folder assets/ dengan nama:
  # box1.jpg, box2.jpg, box3.jpeg, box4.jpg, box5.jpg, box6.jpg
  assets:
    - assets/

  # Font 'Varela' (opsional): unduh Varela Round dari Google Fonts,
  # taruh di assets/fonts/, lalu aktifkan blok berikut:
  # fonts:
  #   - family: Varela
  #     fonts:
  #       - asset: assets/fonts/VarelaRound-Regular.ttf
